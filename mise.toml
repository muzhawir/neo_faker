# Tools configurations

[tools]

erlang = "29.0.6"
elixir = "1.20.4-otp-29"

# Task definitions

[tasks.format]

description = "Format the codebase"
run = [
  "mix format"
]

[tasks.lint]

description = "Format and lint the codebase"
run = [
  "mix format",
  "mix credo"
]

[tasks.analyze]

description = "Format, lint, and analyze the codebase"
run = [
  "mix format",
  "mix credo",
  "mix dialyzer"
]

[tasks.fix]

description = "Format, lint, analyze, and test the codebase"
run = [
  "mix format",
  "mix credo",
  "mix dialyzer",
  "mix test"
]
